premise: "相恋六年的婚礼前夕，女主被系统绑定，系统说'只有感情有裂痕的情侣才会被选中'，给她七天倒计时——七天内男友不真心悔改，她就会彻底消失。"

background: "当代一线城市，女主和男友相恋六年即将结婚，男友是富二代，女主是独立设计师，表面是人人羡慕的神仙眷侣，但闺蜜一直插在两人之间。"
hero: "沈念，27岁，室内设计师，独立清醒有洁癖，对感情要求绝对忠诚，表面温柔但骨子里决绝，被系统绑定后没有崩溃，而是冷静观察、收集证据。"
characters:
  - "顾言泽：男友，29岁，富二代，家族企业继承人，表面深情体贴，实则和女主闺蜜暧昧多年，习惯了女主的付出，认为她永远不会离开"
  - "林薇薇：女主闺蜜，27岁，白莲花人设，表面和女主情同姐妹，背地里一直暗恋顾言泽，多次设计挑拨，是背叛的核心"
  - "系统：神秘存在，没有实体，只在女主脑海中说话，语气机械但偶尔流露出同情，规则是'七天内对方真心悔改则解绑，否则宿主消失'"
plot_direction: "婚礼前第七天，沈念被系统绑定，系统警告感情有裂痕，她不信→第二天无意中看到顾言泽和林薇薇的聊天记录，发现两人暧昧已久，甚至婚礼前夜还在约会→沈念没有揭穿，假装什么都没发生，暗中收集证据→第五天单身派对，林薇薇故意灌醉顾言泽并设计让沈念撞见，沈念冷静录下证据→第七天婚礼现场，沈念在交换戒指环节播放顾言泽和林薇薇的聊天记录、酒店监控录音，当众取消婚礼→系统倒计时归零，沈念'消失'（系统将她传送到另一座城市，所有人都以为她出了意外）→顾言泽崩溃，发现林薇薇的真面目后和她决裂，开始疯狂寻找沈念，跨城市追妻火葬场，但沈念在新城市重新开始，彻底拉黑他，最后一幕顾言泽在她新公司楼下等了三天，她只是从侧门走了，没有回头。"
