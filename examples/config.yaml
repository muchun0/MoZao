# =============================================================
# AI 自动生成小说 —— 示例配置
# 复制本文件为 config.yaml 后按需修改，然后运行：
#   python -m novel_gen all --config config.yaml
# =============================================================

# ---- 小说参数 ----
title: "剑出昆仑"          # 书名
genre: "玄幻"              # 题材：玄幻/仙侠/都市/科幻/历史/悬疑/言情/游戏/奇幻/体育/军事/自定义
total_words: 100000        # 单本目标总字数（10 万字）
chapter_words: 2500        # 单章目标字数（约 40 章）
style: ""                  # 文风要求，可写「轻松诙谐」「冷峻写实」「热血王道」，留空由模型自由发挥
premise: ""                # 核心创意/一句话简介，留空则仅按题材生成

# ---- 用户自定义设定（扩展字段）----
# 强约束（AI 必须严格遵循，不得违背）：
background: ""             # 故事背景/时代/世界观，如「架空宋代，江湖与朝堂并立」
hero: ""                   # 主角设定：姓名/身份/性格/目标，如「苏晚，女捕快，冷静果决，目标是查清灭门案」
characters: []             # 配角/反派预设列表，如 ["沈砚：神秘剑客，亦正亦邪", "赵虎：捕头，粗中有细"]
forbidden: []              # 避雷/不想出现的元素，如 ["穿越", "系统", "狗血误会"]
# 参考方向（AI 可在此基础上细化发挥）：
plot_direction: ""         # 剧情走向/关键情节/必须出现的桥段，如「中段主角被诬陷逐出师门，后期真相大白复仇」

# ---- 流程控制 ----
confirm: false             # true = 每个阶段（调研/大纲/人物/正文）生成后暂停等待人工确认；false = 自动推进
memory_window: 5           # 生成当前章时，回填最近 N 章摘要用于保持剧情一致

# ---- 质量增强 ----
editor_review: true        # 大纲后编辑视角质检，不通过自动修正一次
de_ai: true                # 正文注入去AI味写作约束
anti_similarity: true      # 防同质化：拒绝套路/人物内在矛盾/剧情有代价/只展示不叙述

# ---- 大模型参数 ----
llm:
  provider: "deepseek"     # deepseek / doubao(火山方舟) / openai / mock(本地假模型,用于无 Key 测试)
  model: ""                # 留空取该 Provider 默认模型
  api_key: ""              # 优先填这里；留空则读取环境变量 DEEPSEEK_API_KEY / ARK_API_KEY / OPENAI_API_KEY
  base_url: ""             # 留空取该 Provider 默认地址；对接自定义中转可在此填写
  temperature: 0.8         # 生成随机度
  max_tokens: 4096         # 单次响应上限（单章输出建议 >= 4000）

# ---- 联网搜索调研（可选，默认关闭）----
# 填上 provider + api_key 后，调研阶段会真实联网搜索该题材热门小说信息。
# 推荐博查(bocha)：中文效果好，新用户有免费额度。申请：https://open.bochaai.com
search:
  provider: ""             # bocha(博查) / serper(Google) / 留空关闭
  api_key: ""              # 博查 API Key（或设环境变量 BOCHA_API_KEY）
  count: 5                 # 每个关键词返回的搜索结果条数
