<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · AI 小说生成器</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="admin-app">
  <!-- ========== 登录视图（仅站长） ========== -->
  <section id="view-login" class="view active">
    <div class="login-wrap">
      <div class="login-card card">
        <h1 class="login-title">🔐 管理后台</h1>
        <p class="login-sub">仅站长可登录 · AI 小说生成器</p>
        <form id="login-form">
          <div class="field">
            <label>站长账号</label>
            <input name="username" required autocomplete="username">
          </div>
          <div class="field">
            <label>密码</label>
            <input name="password" type="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn primary block">登 录</button>
          <div id="login-error" class="error-box hidden"></div>
        </form>
      </div>
    </div>
  </section>

  <!-- ========== 管理主界面 ========== -->
  <section id="view-main" class="view">
    <header class="topbar">
      <div class="brand">⚙ 管理后台 · AI 小说生成器</div>
      <div class="topbar-right">
        <span class="admin-name" id="admin-name"></span>
        <a class="btn ghost small" href="/" target="_blank">← 返回前台</a>
        <button class="btn ghost small" id="btn-logout">退出登录</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <button class="side-btn active" data-view="overview">📊 经营概览</button>
        <button class="side-btn" data-view="users">👥 用户管理</button>
        <button class="side-btn" data-view="agents">🔗 代理管理</button>
        <button class="side-btn" data-view="projects">📚 项目总览</button>
        <button class="side-btn" data-view="refunds">💰 退款管理</button>
        <button class="side-btn" data-view="recharges">💳 余额流水</button>
        <button class="side-btn" data-view="logs">📜 系统日志</button>
        <button class="side-btn" data-view="settings">⚙ 系统参数</button>
      </aside>

      <main class="content">
        <!-- 概览 -->
        <div id="view-overview" class="panel active">
          <h2>经营概览</h2>
          <div class="stat-grid" id="stat-grid">加载中…</div>
        </div>

        <!-- 用户管理 -->
        <div id="view-users" class="panel">
          <h2>用户管理</h2>
          <div class="table-wrap">
            <table class="tbl" id="user-table">
              <thead><tr>
                <th>ID</th><th>用户名</th><th>余额</th><th>身份</th><th>代理折扣</th>
                <th>邀请码</th><th>下级</th><th>累计返佣</th><th>注册时间</th><th>操作</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 代理管理 -->
        <div id="view-agents" class="panel">
          <h2>代理管理</h2>
          <div class="table-wrap">
            <table class="tbl" id="agent-table">
              <thead><tr>
                <th>ID</th><th>用户名</th><th>余额</th><th>折扣</th><th>下级数</th><th>累计返佣</th><th>操作</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="agent-detail" class="agent-detail"></div>
        </div>

        <!-- 项目总览 -->
        <div id="view-projects" class="panel">
          <h2>项目总览</h2>
          <div class="table-wrap">
            <table class="tbl" id="project-table">
              <thead><tr>
                <th>标题</th><th>归属用户</th><th>题材</th><th>章节</th><th>阶段</th><th>创建时间</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 退款管理 -->
        <div id="view-refunds" class="panel">
          <h2>退款管理 <span id="refund-mail-status" class="muted"></span></h2>
          <div class="tabs" id="refund-tabs">
            <button class="tab active" data-status="">全部</button>
            <button class="tab" data-status="pending">待处理</button>
            <button class="tab" data-status="approved">已退款</button>
            <button class="tab" data-status="rejected">已拒绝</button>
          </div>
          <div class="table-wrap">
            <table class="tbl" id="refund-table">
              <thead><tr>
                <th>ID</th><th>用户</th><th>金额</th><th>原因</th><th>状态</th><th>申请时间</th><th>处理时间</th><th>站长备注</th><th>操作</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 余额流水 -->
        <div id="view-recharges" class="panel">
          <h2>余额流水</h2>
          <div class="table-wrap">
            <table class="tbl" id="recharge-table">
              <thead><tr>
                <th>时间</th><th>用户</th><th>金额</th><th>备注</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 系统日志 -->
        <div id="view-logs" class="panel">
          <div class="logs-head">
            <h2>系统日志 <span class="muted" id="log-file-label"></span></h2>
            <div class="logs-actions">
              <button class="btn small" id="btn-refresh-logs">🔄 刷新</button>
            </div>
          </div>
          <pre class="log-viewer" id="log-viewer">加载中…</pre>
        </div>

        <!-- 系统参数 -->
        <div id="view-settings" class="panel">
          <h2>系统参数</h2>
          <div id="settings-box" class="settings-box">加载中…</div>
        </div>
      </main>
    </div>
  </section>
</div>

<!-- 充值弹层 -->
<div id="recharge-modal" class="modal hidden">
  <div class="modal-content narrow">
    <div class="modal-head">
      <h3 id="rm-title">充值</h3>
      <button class="btn ghost" id="btn-close-rm">✕ 关闭</button>
    </div>
    <div class="modal-body">
      <p class="muted">用户 <strong id="rm-user"></strong> 当前余额 <strong id="rm-balance"></strong> 元</p>
      <div class="field">
        <label>充值金额（元）</label>
        <input id="rm-amount" type="number" min="0.01" step="0.01" placeholder="0.99">
      </div>
      <button class="btn primary block" id="btn-confirm-rm">确认到账</button>
      <div id="rm-error" class="error-box hidden"></div>
    </div>
  </div>
</div>

<!-- 设代理弹层 -->
<div id="agent-modal" class="modal hidden">
  <div class="modal-content narrow">
    <div class="modal-head">
      <h3>设为代理</h3>
      <button class="btn ghost" id="btn-close-am">✕ 关闭</button>
    </div>
    <div class="modal-body">
      <p class="muted">用户 <strong id="am-user"></strong></p>
      <div class="field">
        <label>消费折扣（0.8 = 8 折）</label>
        <input id="am-discount" type="number" min="0.01" max="1" step="0.05" value="0.8">
      </div>
      <button class="btn primary block" id="btn-confirm-am">确认开通</button>
      <div id="am-error" class="error-box hidden"></div>
    </div>
  </div>
</div>

<!-- 退款处理弹层 -->
<div id="refund-handle-modal" class="modal hidden">
  <div class="modal-content narrow">
    <div class="modal-head">
      <h3 id="rhm-title">处理退款</h3>
      <button class="btn ghost" id="btn-close-rhm">✕ 关闭</button>
    </div>
    <div class="modal-body">
      <p class="muted">用户 <strong id="rhm-user"></strong> 申请退款 <strong id="rhm-amount" class="hl"></strong> 元<br>原因：<span id="rhm-reason"></span></p>
      <div class="field" style="margin-top:12px">
        <label>备注（选填，将展示给用户）</label>
        <input id="rhm-note" type="text" placeholder="例如：已微信转账">
      </div>
      <div class="rhm-actions">
        <button class="btn danger block" id="btn-rhm-reject">❌ 拒绝退款</button>
        <button class="btn primary block" id="btn-rhm-approve">✅ 确认已转账并退款</button>
      </div>
      <div id="rhm-error" class="error-box hidden"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="admin.js"></script>
</body>
</html>
